[package]
name = "agentpulse-platform-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# AppKit and other macOS system APIs, kept out of the GPUI app crate.
# Same objc2 versions as gpui_macos, so nothing new is compiled.
[dependencies]
# NSURLSession's completion handler is a block. The version already in Cargo.lock.
block2 = "=0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAccessibility",
    "NSAccessibilityProtocols",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSView",
    "NSWorkspace",
] }

[dev-dependencies]
# Measures a menu row's text in the rows test.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSStringDrawing"] }
