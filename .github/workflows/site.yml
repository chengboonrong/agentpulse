name: Site

on:
  pull_request:
    paths: [site/**, scripts/check-site.py, .github/workflows/site.yml]
  push:
    branches: [main]
    paths: [site/**, scripts/check-site.py, .github/workflows/site.yml]
  # Every Download button needs AgentPulse.dmg on the latest release: re-check the links
  # whenever a release is published (deploy stays limited to main).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The page's own rules: one-click download, section order, contrast, no third parties.
      - run: python3 scripts/check-site.py
      # Every link on the page, including the releases/latest download, must resolve. The
      # site's own URL is skipped: it only exists once this workflow has deployed.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude 'agentpulse\.snitco\.com' 'site/**/*.html'
          fail: true

  deploy:
    needs: links
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
