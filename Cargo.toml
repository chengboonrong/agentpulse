[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.5"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agentpulse-core = { path = "crates/agentpulse-core" }
agentpulse-telemetry = { path = "crates/agentpulse-telemetry" }
agentpulse-cost = { path = "crates/agentpulse-cost" }
agentpulse-process = { path = "crates/agentpulse-process" }
agentpulse-storage = { path = "crates/agentpulse-storage" }
agentpulse-animation = { path = "crates/agentpulse-animation" }
agentpulse-platform-macos = { path = "crates/agentpulse-platform-macos" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
png = "0.18.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# GPUI has no usable crates.io release of its current API (see docs/repository-audit.md),
# so it is pinned to an exact Zed commit. Bump deliberately and re-run the app.
# `runtime_shaders` compiles Metal shaders at launch, so building does not need
# Xcode's separately downloaded Metal Toolchain.
gpui = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c", features = ["runtime_shaders"] }

[profile.release]
lto = "thin"
